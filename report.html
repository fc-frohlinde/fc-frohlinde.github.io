<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1228">
<title>Wochenbericht · Flutlicht</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<meta name="robots" content="noindex, nofollow">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg0:#080f22; --bg1:#0c1733; --bg2:#102047;
    --card:#131f3d; --card-br:#22335f;
    --blue:#2e7de4; --blue-d:#1659b8; --blue-l:#5b9bf0;
    --txt:#eef2fb; --txt-dim:#9aa8c8; --txt-faint:#6478a0;
    --gold:#f5c542; --silver:#cdd6e6; --bronze:#d98b4a;
    --green:#3ddc84; --amber:#f5a623; --red:#ff5c5c;
    --glow:rgba(46,125,228,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg0);}
  body{
    font-family:'Barlow',system-ui,sans-serif;
    color:var(--txt);
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 20% -5%, rgba(46,125,228,.22), transparent 70%),
      radial-gradient(700px 400px at 90% 0%, rgba(245,197,66,.10), transparent 65%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 45%, var(--bg0) 100%);
    background-attachment:fixed;
    line-height:1.5;
    padding:0 0 50px;
    overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  /* ── Loading / Error states ── */
  .state{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;
  }
  .spinner{
    width:42px;height:42px;border-radius:50%;
    border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue-l);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-emoji{font-size:3rem;}
  .state h2{font-family:'Bebas Neue';font-size:1.7rem;letter-spacing:1px;color:var(--txt);}
  .state p{color:var(--txt-dim);font-size:.92rem;max-width:340px;}

  /* ── Hero ── */
  .hero{
    text-align:center;padding:36px 16px 26px;position:relative;
  }
  .hero::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:280px;height:160px;
    background:radial-gradient(ellipse, var(--glow), transparent 70%);
    pointer-events:none;
  }
  .hero-crest{
    width:74px;height:74px;border-radius:50%;object-fit:cover;
    border:2px solid var(--card-br);background:var(--card);
    margin:0 auto 12px;display:block;position:relative;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .hero-crest-fallback{
    width:74px;height:74px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--blue-d));
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:2rem;color:#fff;
    margin:0 auto 12px;position:relative;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .hero-club{
    font-size:.78rem;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--txt-dim);font-weight:700;position:relative;
  }
  .hero-title{
    font-family:'Bebas Neue';font-size:2.9rem;line-height:.95;
    letter-spacing:1.5px;margin:6px 0 2px;position:relative;
    background:linear-gradient(180deg,#ffffff 30%,#b9ccf0);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero-team{
    display:inline-flex;align-items:center;gap:8px;position:relative;
    font-family:'Barlow Condensed';font-weight:700;font-size:1.15rem;
    color:var(--blue-l);letter-spacing:.5px;text-transform:uppercase;
    margin-top:2px;
  }
  .hero-week{
    position:relative;margin-top:14px;display:inline-block;
    padding:7px 18px;border-radius:999px;
    background:rgba(46,125,228,.14);border:1px solid rgba(46,125,228,.35);
    font-weight:700;font-size:.86rem;color:var(--txt);
  }
  .hero-week b{font-family:'Bebas Neue';font-size:1.05rem;letter-spacing:1px;margin-right:5px;color:var(--blue-l);}
  .hero-dates{position:relative;margin-top:7px;font-size:.8rem;color:var(--txt-faint);}

  /* ── Section ── */
  .sec{margin-top:26px;}
  .sec-head{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px;
  }
  .sec-head h2{
    font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:1px;color:var(--txt);
  }
  .sec-head .sec-line{
    flex:1;height:1px;background:linear-gradient(90deg,var(--card-br),transparent);
  }

  /* ── Week sessions strip ── */
  .week-card{
    background:var(--card);border:1px solid var(--card-br);border-radius:16px;
    padding:16px;
  }
  .sess-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .sess-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  }
  .sess-ico{font-size:1.1rem;}
  .sess-date{font-weight:700;font-size:.9rem;}
  .sess-type{
    font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    color:var(--txt-dim);font-weight:700;
  }
  .sess-label{margin-left:auto;font-size:.82rem;color:var(--txt-dim);font-style:italic;}
  .week-team-stat{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:14px;border-top:1px solid var(--card-br);
  }
  .week-team-stat .lbl{font-size:.82rem;color:var(--txt-dim);font-weight:600;}
  .week-team-stat .val{font-family:'Bebas Neue';font-size:2rem;letter-spacing:1px;}

  /* ── Ranking ── */
  .rank-list{display:flex;flex-direction:column;gap:8px;}
  .full-card{background:var(--card);border:1px solid var(--card-br);border-radius:14px;padding:13px 15px;}
  .full-lbl{font-size:.74rem;color:var(--txt-faint);margin-bottom:4px;}
  .full-names{font-weight:700;font-size:.95rem;line-height:1.45;color:var(--txt);}
  /* "Immer dabei" as a wall of faces (1.2.35) */
  .full-card .full-lbl{margin-bottom:12px;}
  .full-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:14px 8px;}
  .fw-p{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center;}
  .fw-p .avatar,.fw-p .avatar-ph{width:56px;height:56px;border:2px solid rgba(61,220,132,.55);box-shadow:0 0 0 3px rgba(61,220,132,.10);}
  .fw-p .avatar-ph{font-size:1.4rem;}
  .fw-n{font-weight:700;font-size:.78rem;line-height:1.2;color:var(--txt);overflow-wrap:anywhere;}
  .preview-note{font-size:.78rem;color:var(--txt-faint);text-align:center;}
  /* ── Personal statistics page ── */
  .ps-wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px;}
  .ps-hero{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .ps-av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;
    border:2px solid rgba(255,255,255,.25);}
  .ps-av-ph{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);
    font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;}
  .ps-name{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:1.5px;color:#fff;line-height:1.1;}
  .ps-meta{font-size:.76rem;color:rgba(255,255,255,.6);margin-top:2px;}
  .ps-kw{font-size:.72rem;color:rgba(255,255,255,.5);margin-bottom:16px;}
  /* Always one row: four columns of equal width, however narrow the screen.
   A minimum width here is what pushed the fourth tile onto its own line. */
.ps-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px;}
.ps-kpis .ps-kpi{min-width:0;padding:11px 3px;}
@media (max-width:360px){
  .ps-kpis{gap:4px;}
  .ps-kpi-l{font-size:.56rem;}
}
  .ps-kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:11px 6px;text-align:center;}
  .ps-kpi-v{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#fff;line-height:1;}
  .ps-kpi-v.good{color:#3ddc84;} .ps-kpi-v.mid{color:#ffd600;} .ps-kpi-v.bad{color:#ff6b5a;}
  .ps-kpi-l{font-size:.6rem;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:4px;}
  .ps-kpi-s{font-size:.62rem;color:rgba(255,255,255,.4);margin-top:2px;}
  .ps-sec{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:14px;margin-bottom:12px;}
  .ps-h{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1.4px;
    color:rgba(255,255,255,.9);margin-bottom:10px;text-transform:uppercase;}
  .ps-split{display:flex;gap:8px;margin-bottom:9px;}
.ps-split>.ps-split-item{flex:1 1 0;min-width:0;}
  .ps-split-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:rgba(255,255,255,.06);border-radius:10px;padding:10px 6px;}
  .ps-split-ic{font-size:1.1rem;}
  .ps-split-v{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;color:#fff;line-height:1;}
  .ps-split-v.good{color:#3ddc84;} .ps-split-v.mid{color:#ffd600;} .ps-split-v.bad{color:#ff6b5a;}
  .ps-split-l{font-size:.62rem;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.5);}
  .ps-counts{font-size:.76rem;color:rgba(255,255,255,.6);text-align:center;}
  .ps-chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:104px;}
  .ps-col{display:flex;flex-direction:column;align-items:center;min-width:0;}
  .ps-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0;}
  .ps-bar{width:62%;max-width:26px;background:#3ddc84;border-radius:4px 4px 0 0;min-height:3px;}
  .ps-bar-alt{background:#4d9fff;}
    .ps-col-l{font-size:.58rem;color:rgba(255,255,255,.45);margin-top:4px;}
  .ps-col-v{font-size:.6rem;color:rgba(255,255,255,.75);font-weight:700;}
  .ps-note{font-size:.66rem;color:rgba(255,255,255,.45);margin-top:8px;line-height:1.4;}
  /* ── 1.2.47: Flutlicht für Spieler — as the player's other screens ── */
  body.ps-mode{--fl-night:#0A1328;--fl-surface:#111D3A;--fl-surface2:#172750;--fl-line:#22386B;--fl-ink:#F3F5FA;--fl-ink2:#B6C4DE;--fl-muted:#8796B8;
    --fl-lamp:#F2C230;--fl-yes:#3CC27E;--fl-no:#EF6A5A;--fl-exc:#E9B65A;--fl-num:'Big Shoulders Display','Bebas Neue',sans-serif;
    background:radial-gradient(70% 360px at 50% 0,rgba(255,206,92,.17),rgba(255,206,92,.05) 55%,transparent 80%) no-repeat,#0A1328;background-attachment:scroll;}
  html:has(body.ps-mode){background:#0A1328;}
  .ps-mode .ps-wrap{max-width:480px;padding:0 16px 34px;}
  .ps-mode .fl-bar{display:flex;align-items:center;justify-content:flex-end;min-height:52px;padding-top:calc(4px + env(safe-area-inset-top,0px));font-size:13px;font-weight:600;color:var(--fl-ink2);}
  .ps-mode .ps-hero{gap:14px;margin:4px 0 16px;}
  .ps-mode .ps-av{width:44px;height:44px;border:0;box-shadow:0 0 0 2px #0A1328,0 0 0 3.5px rgba(242,194,48,.55);}
  .ps-mode .ps-av-ph{background:#2C5BA8;font-family:var(--fl-num);font-weight:800;font-size:17px;}
  .ps-mode .ps-name{font-family:var(--fl-num);font-weight:800;font-size:32px;letter-spacing:.2px;line-height:1;color:var(--fl-ink);}
  .ps-mode .ps-meta{font-size:14px;color:var(--fl-ink2);margin-top:4px;}
  .ps-mode .ps-kpis{grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-bottom:6px;}
  .ps-mode .ps-kpis .ps-kpi,.ps-mode .ps-kpi{background:var(--fl-surface);border:1px solid var(--fl-line);border-radius:14px;padding:12px 12px 10px;text-align:left;}
  .ps-mode .ps-kpi-v{font-family:var(--fl-num);font-weight:800;font-size:34px;line-height:1;color:var(--fl-ink);}
  .ps-mode .ps-kpi.big .ps-kpi-v{font-size:44px;color:var(--fl-lamp);}
  .ps-mode .ps-kpi-l{font-size:13px;letter-spacing:0;text-transform:none;color:var(--fl-ink2);font-weight:600;margin-top:4px;}
  .ps-mode .ps-kpi-s{font-size:12.5px;color:var(--fl-muted);}
  .ps-mode .ps-h{font-family:'Barlow',sans-serif;font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fl-ink2);margin:20px 2px 9px;}
  .ps-mode .ps-box{background:var(--fl-surface);border:1px solid var(--fl-line);border-radius:16px;padding:14px;}
  .ps-mode .ps-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ps-mode .ps-two.three{grid-template-columns:1fr 1fr 1fr;}
  .ps-mode .ps-two>div{background:var(--fl-surface2);border-radius:12px;padding:12px;min-width:0;}
  .ps-mode .ps-two b{display:block;font-family:var(--fl-num);font-weight:800;font-size:32px;line-height:1;color:var(--fl-ink);}
  .ps-mode .ps-two.three b{font-size:27px;}
  .ps-mode .ps-two small{font-size:13px;color:var(--fl-ink2);font-weight:600;}
  .ps-mode .ps-tally{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--fl-ink2);font-weight:600;}
  .ps-mode .ps-tally.ink{color:var(--fl-ink);}
  .ps-mode .ps-tally i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .ps-mode .ps-bars{display:flex;gap:6px;}
  .ps-mode .ps-bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
  .ps-mode .ps-bars i{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:100%;height:104px;}
  .ps-mode .ps-bars s{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:#2E4A86;min-height:3px;}
  .ps-mode .ps-bars s.hi{background:var(--fl-lamp);}
  .ps-mode .ps-bars s.ex{background:var(--fl-exc);min-height:6px;}
  .ps-mode .ps-bars em.ex{color:var(--fl-exc);}
  .ps-mode .ps-bars em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--fl-ink2);font-variant-numeric:tabular-nums;line-height:1;}
  .ps-mode .ps-bars .free em{color:var(--fl-muted);font-size:15px;}
  .ps-mode .ps-bars small{font-size:11px;color:var(--fl-muted);font-weight:600;}
  /* 1.2.49: tiles fill their rows evenly (balTiles), as in the app */
  .ps-mode [data-bal]{display:flex;flex-wrap:wrap;}
  .ps-mode .ps-two.wd b{font-size:28px;}
  .ps-mode .ps-of{display:block;font-size:12.5px;color:var(--fl-muted);font-weight:600;margin-top:3px;}
  .ps-mode .ps-legend{font-size:12.5px;color:var(--fl-muted);margin-top:8px;}
  .ps-mode .ps-foot{font-size:12.5px;color:var(--fl-muted);margin-top:20px;}
  .ps-foot{font-size:.66rem;color:rgba(255,255,255,.35);text-align:center;margin-top:18px;}
  .rank-row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--card-br);
    border-radius:14px;padding:11px 13px;
    opacity:0;transform:translateY(14px);
    animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .rank-num{
    flex-shrink:0;width:30px;text-align:center;
    font-family:'Bebas Neue';font-size:1.5rem;color:var(--txt-faint);letter-spacing:.5px;
  }
  .rank-row.top1{
    border-color:rgba(245,197,66,.5);
    background:linear-gradient(100deg,rgba(245,197,66,.12),var(--card) 55%);
    box-shadow:0 4px 22px rgba(245,197,66,.13);
  }
  .rank-row.top2{
    border-color:rgba(205,214,230,.42);
    background:linear-gradient(100deg,rgba(205,214,230,.10),var(--card) 55%);
  }
  .rank-row.top3{
    border-color:rgba(217,139,74,.42);
    background:linear-gradient(100deg,rgba(217,139,74,.10),var(--card) 55%);
  }
  .rank-row.top1 .rank-num{color:var(--gold);}
  .rank-row.top2 .rank-num{color:var(--silver);}
  .rank-row.top3 .rank-num{color:var(--bronze);}
  .rank-medal{font-size:1.3rem;line-height:1;}

  .avatar{
    flex-shrink:0;width:46px;height:46px;border-radius:50%;
    object-fit:cover;border:2px solid var(--card-br);background:var(--bg2);
  }
  .avatar-ph{
    flex-shrink:0;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:1.25rem;color:#fff;letter-spacing:.5px;
    border:2px solid rgba(255,255,255,.1);
  }
  .rank-info{flex:1;min-width:0;}
  .rank-name{
    font-weight:700;font-size:.97rem;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rank-meta{
    display:flex;align-items:center;gap:7px;margin-top:2px;
    font-size:.72rem;color:var(--txt-faint);
  }
  .rank-nr{
    font-family:'Barlow Condensed';font-weight:700;
    color:var(--blue-l);
  }
  .rank-pos{
    background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;
    font-weight:700;letter-spacing:.5px;
  }
  .rank-cells{display:flex;gap:2px;font-size:.82rem;margin-top:3px;}
  .rank-pct{
    flex-shrink:0;text-align:right;min-width:58px;
  }
  .rank-pct .num{
    font-family:'Bebas Neue';font-size:2rem;line-height:.9;letter-spacing:.5px;
  }
  .rank-pct .sub{font-size:.66rem;color:var(--txt-faint);font-weight:600;margin-top:1px;}
  .pct-hi{color:var(--green);}
  .pct-mid{color:#ffd600;}
  .pct-lo{color:#ff3131;}
  .pct-zero{color:var(--txt-faint);}

  /* ── Team totals ── */
  .team-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  .team-stat{
    background:var(--card);border:1px solid var(--card-br);
    border-radius:14px;padding:14px;text-align:center;
  }
  .team-stat .ts-val{
    font-family:'Bebas Neue';font-size:2.4rem;line-height:.9;letter-spacing:1px;
  }
  .team-stat .ts-lbl{
    font-size:.72rem;color:var(--txt-dim);font-weight:700;
    text-transform:uppercase;letter-spacing:1px;margin-top:5px;
  }
  .team-stat.wide{grid-column:1 / -1;}

  /* ── Legend ── */
  .legend{
    display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
    margin-top:14px;font-size:.74rem;color:var(--txt-dim);
  }
  .legend span{display:inline-flex;align-items:center;gap:4px;}

  /* ── Footer ── */
  .footer{
    text-align:center;margin-top:36px;padding-top:22px;
    border-top:1px solid var(--card-br);
  }
  .footer-brand{
    font-family:'Bebas Neue';font-size:1.25rem;letter-spacing:1.5px;
    color:var(--txt-dim);
  }
  .footer-brand b{color:var(--blue-l);}
  .footer-meta{font-size:.72rem;color:var(--txt-faint);margin-top:5px;}

  /* ── Ranking toggle + dual pct ── */
  .rank-tog{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--card-br);border-radius:8px;padding:2px;flex-shrink:0;}
  .rank-tog-btn{
    background:transparent;color:var(--txt-dim);border:none;
    padding:5px 12px;font-family:'Barlow',sans-serif;font-size:.74rem;font-weight:700;
    border-radius:6px;cursor:pointer;letter-spacing:.3px;
    transition:background .15s,color .15s;white-space:nowrap;
  }
  .rank-tog-btn:hover{color:var(--txt);}
  .rank-tog-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(46,125,228,.35);}
  .rank-sub{font-size:.8rem;color:var(--txt-dim);margin-bottom:12px;padding:0 2px;}
  .rank-pct-main{text-align:right;}
  .rank-pct-alt{
    margin-top:5px;text-align:right;
    font-size:.66rem;color:var(--txt-faint);
    border-top:1px solid rgba(255,255,255,.06);padding-top:4px;
  }
  .rank-pct-alt .alt-lbl{
    color:var(--txt-faint);font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    margin-right:5px;
  }
  .rank-pct-alt .alt-val{font-weight:700;}
  @media(max-width:380px){
    .sec-head{flex-wrap:wrap;}
    .rank-tog{margin-top:6px;flex:0 0 auto;}
    .rank-tog-btn{padding:5px 9px;font-size:.7rem;}
  }
  .empty-week{
    background:var(--card);border:1px solid var(--card-br);border-radius:16px;
    padding:28px 20px;text-align:center;
  }
  .empty-week-ico{font-size:2.6rem;margin-bottom:10px;}
  .empty-week-txt{color:var(--txt-dim);font-size:.92rem;line-height:1.6;}
  .empty-week-txt b{color:var(--txt);}
  .fade-seq{opacity:0;animation:fadeUp .55s ease forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .live-back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:50;
    padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
    background:rgba(19,31,61,.85);color:#eef2fb;font:600 .8rem 'Barlow',sans-serif;cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  body.live{padding-top:46px;}
  .live-back:hover{background:rgba(34,51,95,.95);}
</style>
</head>
<body>

<div id="app">
  <!-- Loading -->
  <div class="state" id="state-loading">
    <div class="spinner"></div>
    <p>Bericht wird geladen…</p>
  </div>
</div>

<script>

// ── Utilities ──
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getParam(name){return new URLSearchParams(location.search).get(name);}
function initials(name){
  const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length)return '?';
  if(parts.length===1)return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatarColor(name){
  let h=0;const s=String(name||'');
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  const hue=Math.abs(h)%360;
  return `linear-gradient(135deg,hsl(${hue},58%,46%),hsl(${(hue+40)%360},60%,34%))`;
}
function pctClass(p){
  // >=80 gruen, 50-79 knallgelb, <50 (auch 0) knallrot; null = keine Daten
  if(p==null)return 'pct-zero';
  if(p>=80)return 'pct-hi';
  if(p>=50)return 'pct-mid';
  return 'pct-lo';
}
const CELL_EMOJI={1:'\u2705',0:'\u274c',2:'\ud83d\udfe1',3:'\u2796'};
let _rankSort='season'; // 'season' | 'week' — toggle state for combined ranking
let _rankState=null;    // {weekRanked, seasonRanked, hasWeekSessions, rankRow}
function cellEmoji(v){return CELL_EMOJI[v]!=null?CELL_EMOJI[v]:'\u2796';}

function renderRankingSection(){
  if(!_rankState)return;
  const el=document.getElementById('ranking-sec');
  if(!el)return;
  const {weekRanked,seasonRanked,hasWeekSessions,rankRow}=_rankState;
  // If there's no week data, lock to season sort
  if(!hasWeekSessions)_rankSort='season';
  const list=_rankSort==='week'?weekRanked:seasonRanked;
  const showAlt=hasWeekSessions; // only show "other" pct when both metrics exist
  const isWeek=_rankSort==='week';
  const seasonBtn=`<button class="rank-tog-btn ${isWeek?'':'active'}" onclick="setRankSort('season')">Saison</button>`;
  const weekBtn=hasWeekSessions
    ? `<button class="rank-tog-btn ${isWeek?'active':''}" onclick="setRankSort('week')">Diese Woche</button>`
    : '';
  const sub=isWeek
    ? 'Teilnahme dieser Woche'
    : 'Gesamte Anwesenheit diese Saison \u2014 hier z\u00e4hlt jede Woche!';
  let html=`<div class="sec-head">
    <h2>\ud83c\udfc6 Rangliste</h2>
    <div class="sec-line"></div>
    <div class="rank-tog">${seasonBtn}${weekBtn}</div>
  </div>
  <p class="rank-sub">${sub}</p>
  <div class="rank-list">${list.map((p,i)=>rankRow(p,i,_rankSort,showAlt)).join('')}</div>`;
  if(hasWeekSessions){
    html+=`<div class="legend">
      <span>\u2705 da</span><span>\ud83d\udfe1 entschuldigt</span>
      <span>\u274c gefehlt</span><span>\u2796 offen</span>
    </div>`;
  }
  el.innerHTML=html;
}
function setRankSort(s){
  if(s!=='week'&&s!=='season')return;
  if(_rankSort===s)return;
  _rankSort=s;
  renderRankingSection();
}
function showError(emoji,title,msg){
  document.getElementById('app').innerHTML=
    `<div class="state"><div class="state-emoji">${emoji}</div>`+
    `<h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`;
}

// ── Render ──
function renderReport(r){
  const app=document.getElementById('app');
  // Avatar helper
  const av=p=>{
    if(p.photo)return `<img class="avatar" src="${esc(p.photo)}" alt="">`;
    return `<div class="avatar-ph" style="background:${avatarColor(p.name)}">${esc(initials(p.name))}</div>`;
  };
  // Ranking row builder — shows BOTH week and season %; active sort is emphasized.
  // Uses competition ranking (tied players share rank).
  const rankRow=(p,idx,activeSort,showAlt)=>{
    // Use pre-computed competition rank; fall back to idx+1 if not available (e.g. null pct).
    const cRank=activeSort==='week'?p._wRank:p._sRank;
    const rank=cRank!=null?cRank:(idx+1);
    const topCls=rank<=3?` top${rank}`:'';
    const medal=rank<=3?['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'][rank-1]:'';
    const cellsHtml=p.wCells&&p.wCells.length
      ? `<div class="rank-cells">${p.wCells.map(cellEmoji).join('')}</div>` : '';
    const numOrMedal=rank<=3
      ? `<div class="rank-num"><span class="rank-medal">${medal}</span></div>`
      : `<div class="rank-num">${rank}</div>`;
    // Primary = active sort, Alt = the other one
    const mainPct=activeSort==='week'?p.wPct:p.sPct;
    const mainSub=activeSort==='week'
      ? (p.wTotal?`${p.wPresent}/${p.wTotal}`:'\u2013')
      : (p.sTotal?`${p.sPresent}/${p.sTotal}`:'\u2013');
    const altPct=activeSort==='week'?p.sPct:p.wPct;
    const altLbl=activeSort==='week'?'Saison':'Woche';
    const altHtml=showAlt
      ? `<div class="rank-pct-alt"><span class="alt-lbl">${altLbl}</span><span class="alt-val ${pctClass(altPct)}">${altPct==null?'\u2013':altPct+'%'}</span></div>`
      : '';
    return `<div class="rank-row${topCls}" style="animation-delay:${Math.min(idx*55,900)}ms">
      ${numOrMedal}
      ${av(p)}
      <div class="rank-info">
        <div class="rank-name">${esc(p.name)}</div>
        <div class="rank-meta">
          ${p.nr?`<span class="rank-nr">#${esc(p.nr)}</span>`:''}
          ${p.pos?`<span class="rank-pos">${esc(p.pos)}</span>`:''}
        </div>
        ${cellsHtml}
      </div>
      <div class="rank-pct">
        <div class="rank-pct-main">
          <div class="num ${pctClass(mainPct)}">${mainPct==null?'\u2013':mainPct+'%'}</div>
          <div class="sub">${esc(mainSub)}</div>
        </div>
        ${altHtml}
      </div>
    </div>`;
  };

  // Sort copies — primary by pct, then presents, then jersey number for stable display.
  // BUT the actual rank is determined by competition ranking on pct only (tied = same rank).
  const weekRanked=[...r.players].sort((a,b)=>
    (b.wPct==null?-1:b.wPct)-(a.wPct==null?-1:a.wPct)
    || b.wPresent-a.wPresent || (a.nr||99)-(b.nr||99));
  const seasonRanked=[...r.players].sort((a,b)=>
    (b.sPct==null?-1:b.sPct)-(a.sPct==null?-1:a.sPct)
    || b.sPresent-a.sPresent || (a.nr||99)-(b.nr||99));
  // Competition ranking (1224): tied pct → same rank, next rank jumps.
  // E.g. 4 players at 100% → all are #1, next is #5.
  const _addCompRank=(arr,pctKey,rankKey)=>{
    arr.forEach(p=>{
      if(p[pctKey]==null){p[rankKey]=null;return;}
      let higher=0;
      arr.forEach(q=>{if(q!==p&&q[pctKey]!=null&&q[pctKey]>p[pctKey])higher++;});
      p[rankKey]=higher+1;
    });
  };
  _addCompRank(weekRanked,'wPct','_wRank');
  _addCompRank(seasonRanked,'sPct','_sRank');

  const ts=r.teamStats||{};
  const wk=r.week||{};
  const crest=r.clubLogo
    ? `<img class="hero-crest" src="${esc(r.clubLogo)}" alt="">`
    : `<div class="hero-crest-fallback">${esc(initials(r.club||'FC'))}</div>`;

  // Sessions strip
  const sessHtml=(wk.sessions||[]).map(s=>{
    const isMatch=s.type==='match';
    return `<div class="sess-row">
      <span class="sess-ico">${isMatch?'\u26bd':'\ud83c\udfc3'}</span>
      <span class="sess-date">${esc(s.date)}</span>
      <span class="sess-type">${isMatch?'Spiel':'Training'}</span>
      ${s.label?`<span class="sess-label">${esc(s.label)}</span>`:''}
    </div>`;
  }).join('');

  let html=`
  <div class="hero">
    ${crest}
    <div class="hero-club">${esc(r.club||'')}</div>
    <div class="hero-title">Wochenbericht</div>
    <div class="hero-team">${esc(r.team||'')} <span style="opacity:.5">·</span> ${esc(r.season||'')}</div>
    <div><span class="hero-week"><b>KW ${esc(wk.kw||'?')}</b></span></div>
    <div class="hero-dates">${esc(wk.from||'')} \u2013 ${esc(wk.to||'')}</div>
  </div>
  <div class="wrap">`;

  const hasWeekSessions=(wk.sessions||[]).length>0;

  if(hasWeekSessions){
    // Diese Woche
    html+=`<div class="sec fade-seq" style="animation-delay:.05s">
      <div class="sec-head"><h2>\ud83d\udcc5 Diese Woche</h2><div class="sec-line"></div></div>
      <div class="week-card">
        <div class="sess-list">${sessHtml}</div>
        <div class="week-team-stat">
          <span class="lbl">Teilnahme der Mannschaft</span>
          <span class="val ${pctClass(ts.weekPct)}">${ts.weekPct==null?'\u2013':ts.weekPct+'%'}</span>
        </div>
      </div>
    </div>`;

  } else {
    // Nothing held yet this week. If sessions are still coming, say so —
    // "keine Termine" would be wrong then.
    const up=(r.week&&Array.isArray(r.week.upcoming))?r.week.upcoming:[];
    const upTxt=up.map(u=>esc(u.date)+(u.time?' '+esc(u.time):'')+' \u00b7 '+(u.type==='match'?('Spiel'+(u.label?' gegen '+esc(u.label):'')):'Training')).join('<br>');
    html+=`<div class="sec fade-seq" style="animation-delay:.05s">
      <div class="empty-week">
        <div class="empty-week-ico">${up.length?'\u23f3':'\u2615'}</div>
        <div class="empty-week-txt">${up.length
          ?`In dieser Woche hat noch <b>kein Termin stattgefunden</b>. Als N\u00e4chstes:<br>${upTxt}`
          :`In dieser Woche gab es <b>keine Termine</b>.`}</div>
      </div>
    </div>`;
  }

  // No ranking and no one else's absences any more (1.2.5): the player sees
  // his own week and who was at every session. Old snapshots without "aud"
  // (an app not yet updated) get the same treatment.
  _rankState=null;
  const me=(r.aud==='players'&&r.me)?(r.players||[]).find(p=>p&&p.name===r.me):null;
  const full=Array.isArray(r.full)?r.full:(r.players||[]).filter(p=>p&&p.wTotal>0&&p.wPct===100).map(p=>p.name);
  if(me){
    const cells=me.wCells&&me.wCells.length?`<div class="rank-cells">${me.wCells.map(cellEmoji).join('')}</div>`:'';
    html+=`<div class="sec fade-seq" style="animation-delay:.1s">
      <div class="sec-head"><h2>\ud83d\ude4b Deine Woche</h2><div class="sec-line"></div></div>
      <div class="rank-list"><div class="rank-row me-row">
        ${av(me)}
        <div class="rank-info"><div class="rank-name">${esc(me.name)}</div>${cells}</div>
        <div class="rank-pct">
          <div class="rank-pct-main"><div class="num ${pctClass(me.wPct)}">${me.wPct==null?'\u2013':me.wPct+'%'}</div><div class="sub">${me.wTotal?esc(me.wPresent+'/'+me.wTotal):'\u2013'}</div></div>
          <div class="rank-pct-alt"><span class="alt-lbl">Saison</span><span class="alt-val ${pctClass(me.sPct)}">${me.sPct==null?'\u2013':me.sPct+'%'}</span></div>
        </div>
      </div></div>
      ${cells?`<div class="legend"><span>\u2705 da</span><span>\ud83d\udfe1 entschuldigt</span><span>\u274c gefehlt</span><span>\u2796 offen</span></div>`:''}
    </div>`;
  }
  if(hasWeekSessions&&full.length){
    // A wall of faces (1.2.35): photo or initials and the name, by name —
    // praise without numbers or order. Old snapshots: names, photos if given.
    const fp=(Array.isArray(r.fullP)&&r.fullP.length)?r.fullP
      :full.map(n=>((r.players||[]).find(p=>p&&p.name===n))||{name:n});
    const tiles=fp.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'de'))
      .map(p=>`<div class="fw-p">${av(p)}<span class="fw-n">${esc(p.name)}</span></div>`).join('');
    html+=`<div class="sec fade-seq" style="animation-delay:.15s">
      <div class="sec-head"><h2>\ud83d\udcaa Immer dabei</h2><div class="sec-line"></div></div>
      <div class="full-card"><div class="full-lbl">Bei allen Terminen dieser Woche dabei</div><div class="full-wall">${tiles}</div></div>
    </div>`;
  }
  if(r.aud==='players'&&!r.me){
    html+=`<div class="sec fade-seq preview-note" style="animation-delay:.18s">Vorschau: So sehen es die Spieler – jeder zusätzlich mit seiner eigenen Woche.</div>`;
  }

  // Mannschaft
  html+=`<div class="sec fade-seq" style="animation-delay:.2s">
    <div class="sec-head"><h2>\u26bd Mannschaft</h2><div class="sec-line"></div></div>
    <div class="team-grid">`;
  // only training or only a match this week: that tile takes the whole row (no gap beside it)
  const one=(ts.weekTrainCount?1:0)+(ts.weekMatchCount?1:0)===1?' wide':'';
  if(ts.weekTrainCount){
    html+=`<div class="team-stat${one}">
      <div class="ts-val ${pctClass(ts.weekPct)}">${ts.trainingAvg==null?'\u2013':'\u2300 '+ts.trainingAvg}</div>
      <div class="ts-lbl">\u00d8 Training (${ts.weekTrainCount}\u00d7)</div>
    </div>`;
  }
  if(ts.weekMatchCount){
    html+=`<div class="team-stat${one}">
      <div class="ts-val ${pctClass(ts.weekPct)}">${ts.matchAvg==null?'\u2013':ts.matchAvg}</div>
      <div class="ts-lbl">\u00d8 Spiel (${ts.weekMatchCount}\u00d7)</div>
    </div>`;
  }
  html+=`<div class="team-stat wide">
      <div class="ts-val ${pctClass(ts.seasonPct)}">${ts.seasonPct==null?'\u2013':ts.seasonPct+'%'}</div>
      <div class="ts-lbl">Saison-Teilnahme gesamt \u00b7 ${esc(ts.rosterSize||'?')} Spieler</div>
    </div>`;
  html+=`</div></div>`;

  // Footer
  const pubDate=r.publishedAt?new Date(r.publishedAt):null;
  const pubStr=pubDate
    ? pubDate.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})
      +' '+pubDate.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
    : '';
  html+=`<div class="footer">
    <div class="footer-brand">erstellt mit <b>Flutlicht</b></div>
    ${pubStr?`<div class="footer-meta">Stand: ${esc(pubStr)}</div>`:''}
  </div>`;

  html+=`</div>`; // .wrap
  app.innerHTML=html;
}

// ── PERSONAL STATISTICS PAGE ──────────────────────────────
// Contains one player only. Deliberately no trainer grades and no team
// ranking: this page belongs to the player, not to a comparison.
// Tiles fill their rows evenly (1.2.49, same rule as the app's _balTiles):
// as few rows as fit, the tiles spread evenly (4 → 2 + 2, 5 → 3 + 2), a
// shorter row stretches to the full width. data-bal = smallest tile width.
function balTiles(el){
  const w=el.clientWidth;if(!w)return;
  const kids=[...el.children],n=kids.length;if(!n)return;
  const gap=parseFloat(getComputedStyle(el).columnGap)||0;
  const min=parseFloat(el.dataset.bal)||100;
  const fit=Math.max(1,Math.floor((w+gap)/(min+gap)));
  const rows=Math.ceil(n/fit),base=Math.floor(n/rows),extra=n%rows;
  let i=0;
  for(let r=0;r<rows;r++){
    const k=base+(r<extra?1:0);
    for(let j=0;j<k;j++,i++){kids[i].style.flex=`1 0 calc((100% - ${(k-1)*gap}px) / ${k} - .5px)`;kids[i].style.minWidth='0';}
  }
}
const _balRO=(typeof ResizeObserver==='function')?new ResizeObserver(es=>es.forEach(e=>balTiles(e.target))):null;
function balAll(root){(root||document).querySelectorAll('[data-bal]').forEach(el=>{balTiles(el);if(_balRO)_balRO.observe(el);});}
function renderPlayerStats(d){
  const p=(d.players&&d.players[0])||{};
  const det=d.detail||{};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pctCls=v=>v==null?'':(v>=80?'good':v>=50?'mid':'bad');
  const av=p.photo?`<img class="ps-av" src="${p.photo}" alt="">`
    :`<div class="ps-av ps-av-ph">${esc((p.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div>`;
  // 1.2.47: the player's night look; no place in the team (as on the card since 1.2.5)
  const pct=v=>v==null?'\u2013':v+' %';
  const n=(v,one,many)=>(v||0)+' '+((v||0)===1?one:many);
  let html=`<div class="fl-bar">KW ${esc(d.week&&d.week.kw)} \u00b7 ${esc(d.week&&d.week.from)}\u2013${esc(d.week&&d.week.to)}</div>
  <div class="ps-hero">
    ${av}
    <div class="ps-hero-txt">
      <div class="ps-name">Meine Statistik</div>
      <div class="ps-meta">${esc(p.name)}${p.nr?' \u00b7 Nr. '+esc(p.nr):''}${p.pos?' \u00b7 '+esc(p.pos):''} \u00b7 Saison ${esc(d.season||'')}</div>
    </div>
  </div>
  <div class="ps-kpis">
    <div class="ps-kpi big"><div class="ps-kpi-v">${pct(p.sPct)}</div><div class="ps-kpi-l">Saison</div><div class="ps-kpi-s">${p.sPresent} von ${p.sTotal}</div></div>
    <div class="ps-kpi"><div class="ps-kpi-v">${p.wPresent}/${p.wTotal}</div><div class="ps-kpi-l">Diese Woche</div><div class="ps-kpi-s">${pct(p.wPct)}</div></div>
    <div class="ps-kpi"><div class="ps-kpi-v">${det.streak||0}</div><div class="ps-kpi-l">Serie</div><div class="ps-kpi-s">in Folge</div></div>
  </div>
  <div class="ps-h">Training und Spiele</div>
  <div class="ps-box"><div class="ps-two">
      <div><b>${pct(det.tPct)}</b><small>Training</small></div>
      <div><b>${pct(det.mPct)}</b><small>Spiele</small></div></div>
    ${(d.scorer&&(d.scorer.apps||d.scorer.goals||d.scorer.assists))?`<div class="ps-tally ink"><span>${n(d.scorer.apps,'Spiel','Spiele')}</span>${d.scorer.goals?`<span>${n(d.scorer.goals,'Tor','Tore')}</span>`:''}${d.scorer.assists?`<span>${n(d.scorer.assists,'Vorlage','Vorlagen')}</span>`:''}</div>`:''}
    <div class="ps-tally"><span><i style="background:var(--fl-yes)"></i>${det.cA||0} dabei</span><span><i style="background:var(--fl-no)"></i>${det.cF||0} gefehlt</span><span><i style="background:var(--fl-exc)"></i>${det.cE||0} entschuldigt</span></div>
  </div>`;
  // 1.2.48: calendar weeks in a row — a week without sessions is "–", not
  // left out; the number above each bar; a week missed only with an excuse
  // in orange, not like a plain absence. Older snapshots have no gaps and no e.
  const tr=(det.trend||[]).filter(t=>t&&t.kw!=null);
  if(tr.filter(t=>t.pct!=null).length>1){
    const exOnly=t=>t.pct===0&&t.e>0&&t.e===t.t;
    const anyEx=tr.some(exOnly),anyFree=tr.some(t=>t.pct==null);
    html+=`<div class="ps-h">Die letzten ${tr.length} Wochen</div><div class="ps-box"><div class="ps-bars">${tr.map(t=>t.pct==null
      ?`<div class="free" title="KW ${esc(t.kw)}: keine Termine oder Pause"><i><em>\u2013</em></i><small>${esc(t.kw)}</small></div>`
      :`<div title="KW ${esc(t.kw)}: ${t.t?esc(t.a)+' von '+esc(t.t):esc(t.pct)+' %'}"><i><em class="${exOnly(t)?'ex':''}">${esc(t.pct)}</em><s class="${t.pct>=100?'hi':exOnly(t)?'ex':''}" style="height:${Math.max(3,Math.round(t.pct*0.8))}px"></s></i><small>${esc(t.kw)}</small></div>`).join('')}</div>
      <div class="ps-legend">Anwesenheit in %. Gelb: bei allen Terminen dabei.${anyEx?' Orange: nur entschuldigt gefehlt.':''}${anyFree?' \u201e\u2013\u201c: keine Termine oder Pause.':''}</div></div>`;
  }
  // 1.2.48: only days with enough sessions to say something; a single
  // Saturday in the season is not a 0-% weekday. The rest in one line.
  if(det.weekday&&det.weekday.length){
    const WD={Mo:'Montag',Di:'Dienstag',Mi:'Mittwoch',Do:'Donnerstag',Fr:'Freitag',Sa:'Samstag',So:'Sonntag'};
    const MIN=3;
    const rows=det.weekday.filter(w=>w&&w.total>0).map(w=>Object.assign({},w,{a:w.a!=null?w.a:Math.round((w.pct||0)*w.total/100)}));
    const reg=rows.filter(w=>w.total>=MIN),rare=rows.filter(w=>w.total<MIN);
    if(reg.length){
      html+=`<div class="ps-h">Nach Wochentag</div><div class="ps-box"><div class="ps-two wd" data-bal="96">${reg.map(w=>
        `<div><b>${pct(w.pct)}</b><small>${esc(WD[w.day]||w.day)}</small><span class="ps-of">${esc(w.a)} von ${esc(w.total)}</span></div>`).join('')}</div>
        ${rare.length?`<div class="ps-legend">Andere Tage: ${rare.map(w=>esc(WD[w.day]||w.day)+' '+esc(w.a)+' von '+esc(w.total)).join(', ')}</div>`:''}</div>`;
    }
  }
  html+=`<div class="ps-foot">Stand: ${new Date(d.publishedAt).toLocaleDateString('de-DE')} \u00b7 ${esc(d.club||'')}</div>`;
  const root=document.getElementById('app')||document.body;
  root.innerHTML='<div class="ps-wrap">'+html+'</div>';
  balAll(root);
  document.body.classList.add('ps-mode');
}

// ── Load ──
(function(){
  // Opened from the player hub: the hub built this report live and handed it
  // over in sessionStorage — nothing to load, nothing published.
  const local=getParam('local');
  if(local){
    let d=null;
    try{d=JSON.parse(sessionStorage.getItem('fcf_live_'+local)||'null');}catch(e){}
    if(!d)try{d=JSON.parse(localStorage.getItem('fcf_live_'+local)||'null');}catch(e){} // trainer preview
    if(!d){
      showError('\u26a0\ufe0f','Nicht verf\u00fcgbar','Bitte \u00fcber dein Spieler-Men\u00fc erneut \u00f6ffnen.');
    }else{
      try{(d.kind==='player')?renderPlayerStats(d):renderReport(d);}
      catch(e){showError('\u26a0\ufe0f','Anzeigefehler','Der Bericht konnte nicht dargestellt werden.');}
    }
    const b=document.createElement('button');
    // No own back button: the phone's back gesture returns to the hub.
    return;
  }
  // Old links (?id=…) pointed at published snapshots. Those are gone: the
  // player menu builds the weekly report and the statistics live.
  showError('\ud83d\udd17','Dieser Link ist veraltet',
    'Wochenbericht und deine Statistik findest du jetzt im Spieler-Men\u00fc \u2014 \u00fcber den Link aus der Team-Gruppe.');
})();
</script>
