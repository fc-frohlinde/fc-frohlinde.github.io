# Übersicht der Bewertungen: nur lesen, ins Protokoll nur Zahlen (keine Namen).
name: Bewertungen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zahlen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/erinnerungen
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/erinnerungen/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: tools/erinnerungen
      - run: node bewertungen.mjs
        working-directory: tools/erinnerungen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
