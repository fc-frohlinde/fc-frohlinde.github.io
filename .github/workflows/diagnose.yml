# Flutlicht · Диагностика входа (временно, удалить после проверки)
name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/diagnose
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/diagnose/auth.mjs
