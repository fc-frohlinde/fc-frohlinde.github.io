# Flutlicht · Regeln prüfen
# Tests tools/regeln/database.rules.json against the Firebase database emulator
# before anyone pastes the rules into the console. Runs on every change there
# and by hand. Results: the run's annotations (one summary, one per failure).
name: Regeln

on:
  push:
    paths:
      - 'tools/regeln/**'
      - '.github/workflows/regeln.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/regeln
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Emulator und Tests
        working-directory: tools/regeln
        # The rules are loaded by test.mjs itself, so a mistake in them shows
        # up as a failed check with the emulator's message, not as a start error.
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.34.1 emulators:exec --only database --project demo-flutlicht "node test.mjs" 2>&1 | tee out.txt
      # Logs of this public repo are not readable from everywhere; the last
      # lines of a failed run as one annotation make the cause visible.
      - name: Ausgabe bei Fehler
        if: failure()
        working-directory: tools/regeln
        run: |
          [ -f out.txt ] || exit 0
          msg=$(tail -n 60 out.txt | grep -v '^::' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Regeln Ausgabe::$msg"
