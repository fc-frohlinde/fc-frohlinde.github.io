# Flutlicht · Regeln prüfen
# Tests tools/regeln/database.rules.json against the Firebase database emulator
# before anyone pastes the rules into the console. Runs on every change there
# and by hand. Results: the run's annotations (one summary, one per failure).
name: Regeln

on:
  push:
    paths:
      - 'tools/regeln/**'
      - '.github/workflows/regeln.yml'
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Опубликовать в Firebase после успешных тестов (иначе только показать отличия)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/regeln
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Emulator und Tests
        working-directory: tools/regeln
        # The rules are loaded by test.mjs itself, so a mistake in them shows
        # up as a failed check with the emulator's message, not as a start error.
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.34.1 emulators:exec --only database --project demo-flutlicht "node test.mjs" 2>&1 | tee out.txt
      # Logs of this public repo are not readable from everywhere; the last
      # lines of a failed run as one annotation make the cause visible.
      - name: Ausgabe bei Fehler
        if: failure()
        working-directory: tools/regeln
        run: |
          [ -f out.txt ] || exit 0
          msg=$(grep -E '^(FAIL|[0-9]+ FAILED|Error)' out.txt | head -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Regeln Ausgabe::$msg"
          # The emulator logs why a rule said no
          if [ -f database-debug.log ]; then
            dbg=$(grep -iE 'denied|error|fail' database-debug.log | tail -n 25 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Emulator::$dbg"
          fi

  # By hand only: compare with the live rules and, if asked, publish them.
  # Runs after the tests above passed. Code: tools/regeln/publish.mjs.
  veroeffentlichen:
    needs: pruefen
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/regeln
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: tools/regeln
      - run: node publish.mjs
        working-directory: tools/regeln
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLISH: ${{ inputs.veroeffentlichen && '1' || '' }}
