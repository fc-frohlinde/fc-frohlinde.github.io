<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Flutlicht ist umgezogen</title>
<script>
// Flutlicht moved to flutlichtapp.de (16.11.2026). Every old link keeps its
// path and everything after "?" (the player's or the team's key) and goes on.
(function(){
  var t='https://flutlichtapp.de'+location.pathname+location.search+location.hash;
  try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});}catch(e){}
  location.replace(t);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://flutlichtapp.de/"></noscript>
<style>
html,body{margin:0;min-height:100%;background:#0E2350;color:#F3F5FA;font:16px/1.5 system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
a{color:#F2C230}
</style>
</head>
<body>
<p>Flutlicht ist jetzt unter <a id="go" href="https://flutlichtapp.de/">flutlichtapp.de</a>.</p>
<script>document.getElementById('go').href='https://flutlichtapp.de'+location.pathname+location.search+location.hash;</script>
</body>
</html>
